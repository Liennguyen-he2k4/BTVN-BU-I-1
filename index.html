<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080309"><title>Em yêu anh ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at center,#321126,#100711 55%,#050306);color:#ffd8e8;font-family:Georgia,serif}#scene{position:fixed;inset:0;overflow:hidden}.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.25;animation:tw 2s infinite alternate}@keyframes tw{to{opacity:1;transform:scale(2)}}.heart{position:absolute;bottom:-45px;color:#ff5599;text-shadow:0 0 12px #ff2f83,0 0 25px #ff2f83;animation:up linear forwards}@keyframes up{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}.word{position:absolute;color:#ffa3c8;text-shadow:0 0 10px #ff3685,0 0 22px #d91e69;font-size:clamp(14px,3vw,22px);white-space:nowrap;opacity:0;animation:fade 5s forwards}@keyframes fade{0%{opacity:0;transform:scale(.8)}18%,75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;pointer-events:none}.main{font-size:clamp(42px,10vw,76px);font-weight:bold;color:#ffc0d9;text-shadow:0 0 15px #ff4d91,0 0 40px #ec287b;animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.sub{font-size:clamp(16px,4vw,25px);line-height:1.65;margin-top:22px;text-shadow:0 0 12px #ff4b91}.tag{margin-top:25px;font:12px Arial;letter-spacing:5px;color:#ff9fc5}#music{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:30px;border:1px solid #ff8fba;background:#2a0d20;color:#ffe6ef;font-size:15px;box-shadow:0 0 20px #e52b79}#note{position:fixed;bottom:82px;width:100%;text-align:center;color:#dca9bf;font:12px Arial}canvas{position:fixed;inset:0;pointer-events:none}
</style></head><body><div id="scene"></div><canvas id="fx"></canvas><div class="center"><div class="main">Em yêu anh ♡</div><div class="sub">Cảm ơn anh đã bên em thời gian qua<br>Anh là điều tuyệt nhất của đời em</div><div class="tag">MÃI MÃI BÊN NHAU</div></div><div id="note">Chạm để bật nhạc ♡</div><button id="music">♫ Bật nhạc tình yêu</button><audio id="song" src="mai-mai-ben-nhau.mp3" loop></audio>
<script>
const scene=document.querySelector('#scene'),phrases=['Em yêu anh ♡','Cảm ơn anh đã bên em thời gian qua','Anh là điều tuyệt nhất của đời em','Mãi mãi bên nhau ♥','Thương anh thật nhiều ♡'];
for(let i=0;i<100;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';scene.append(s)}
function heart(){let h=document.createElement('span');h.className='heart';h.textContent=['♥','♡','💗','❤'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'%';h.style.fontSize=14+Math.random()*25+'px';let t=7+Math.random()*7;h.style.animationDuration=t+'s';scene.append(h);setTimeout(()=>h.remove(),t*1000)}
function word(){let w=document.createElement('div');w.className='word';w.textContent=phrases[Math.floor(Math.random()*phrases.length)];w.style.left=(2+Math.random()*40)+'%';w.style.top=(8+Math.random()*80)+'%';scene.append(w);setTimeout(()=>w.remove(),5200)}
setInterval(heart,300);setInterval(word,750);word();
const song=document.querySelector('#song'),btn=document.querySelector('#music');btn.onclick=async()=>{try{if(song.paused){await song.play();btn.textContent='Ⅱ Tạm dừng nhạc'}else{song.pause();btn.textContent='♫ Bật nhạc tình yêu'}}catch(e){alert('Thêm file mai-mai-ben-nhau.mp3 cạnh index.html để phát nhạc nhé!')}};
const c=document.querySelector('#fx'),ctx=c.getContext('2d');let W,H,ps=[];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
function burst(){let x=Math.random()*W,y=H*(.2+Math.random()*.45),hue=320+Math.random()*40;for(let i=0;i<50;i++){let a=2*Math.PI*i/50,v=1+Math.random()*3;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:60,hue})}}setInterval(burst,2100);
function draw(){ctx.clearRect(0,0,W,H);ps=ps.filter(p=>p.life>0);for(let p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--;ctx.globalAlpha=p.life/60;ctx.fillStyle=`hsl(${p.hue},100%,75%)`;ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}draw();
</script></body></html>
